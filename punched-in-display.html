<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUNCHED IN — Live Display</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #D6EAF8;
    --punch: #E83B2A;
    --gold: #C8A84B;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-mono);
    background: var(--bg);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  /* 배경 스캔라인 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* 상단 헤더 */
  .display-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(13,13,11,0.95) 0%, transparent 100%);
  }
  .display-title {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .display-subtitle {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.3);
    text-transform: uppercase;
  }
  .live-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--punch);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* 카드 컨테이너 */
  #cardStage {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ─── FIX 1 & 3: 더 넓게 퍼지고, 움직임도 훨씬 크게 ───
     float animation의 translateY를 -40px ~ +20px 범위로 키움.
     각 카드가 서로 다른 duration과 delay를 가져서 파도처럼 움직임. */
  .float-card {
    position: absolute;
    width: 260px;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(40px) rotate(var(--rot));
    transition: opacity 1s ease, transform 1s ease;
  }
  .float-card.visible {
    opacity: 1;
    transform: translateY(0px) rotate(var(--rot));
    animation: float var(--duration) ease-in-out infinite var(--delay);
  }

  /* FIX 3: 훨씬 큰 움직임 — 기존 -12px에서 -45px로 확대 */
  @keyframes float {
    0%   { transform: translateY(0px)   rotate(var(--rot)); }
    25%  { transform: translateY(-45px) rotate(calc(var(--rot) + 0.5deg)); }
    50%  { transform: translateY(-20px) rotate(calc(var(--rot) - 0.3deg)); }
    75%  { transform: translateY(-55px) rotate(calc(var(--rot) + 0.8deg)); }
    100% { transform: translateY(0px)   rotate(var(--rot)); }
  }

  /* 역할별 카드 색상 */
  .float-card.role-student { --card-bg: #C8D8E8; --card-ink: #1A2A3A; --card-accent: #2A5A8A; }
  .float-card.role-faculty { --card-bg: #E8D08A; --card-ink: #2A1A08; --card-accent: #8A5A10; }
  .float-card.role-artist  { --card-bg: #E8C8D0; --card-ink: #2A1A1E; --card-accent: #8A2A4A; }
  .float-card.role-outside { --card-bg: #D0C8E8; --card-ink: #1A1A2A; --card-accent: #4A2A8A; }
  .float-card.role-default { --card-bg: #F5F0E8; --card-ink: #1A1814; --card-accent: #E83B2A; }

  .card-stripe {
    height: 6px;
    background: repeating-linear-gradient(90deg,
      var(--card-accent) 0px, var(--card-accent) 16px,
      var(--card-ink) 16px, var(--card-ink) 32px,
      var(--gold) 32px, var(--gold) 48px,
      var(--card-ink) 48px, var(--card-ink) 64px
    );
  }
  .card-inner {
    background: var(--card-bg);
    padding: 12px 14px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .card-exhibition {
    font-size: 7px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--card-accent);
    margin-bottom: 2px;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--card-ink);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .card-num {
    font-size: 10px;
    font-weight: 600;
    color: var(--card-accent);
    letter-spacing: 1px;
  }

  .hole-row {
    display: flex;
    gap: 4px;
    padding: 6px 0;
    border-top: 1px solid rgba(0,0,0,0.1);
    border-bottom: 1px solid rgba(0,0,0,0.1);
    margin-bottom: 10px;
  }
  .hole {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.12);
  }
  .hole.punched {
    background: var(--card-accent);
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  .card-quote {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--card-ink);
    line-height: 1.5;
    margin-bottom: 8px;
    padding-left: 8px;
    border-left: 2px solid var(--card-accent);
  }
  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .card-tag {
    font-size: 7px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--card-accent);
    border-radius: 1px;
    color: var(--card-accent);
  }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.1);
  }
  .card-time {
    font-size: 8px;
    color: rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }
  .card-type {
    font-size: 8px;
    font-weight: 600;
    color: var(--card-accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* 하단 카운터 */
  .display-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    background: linear-gradient(to top, rgba(13,13,11,0.95) 0%, transparent 100%);
  }
  .counter {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.3);
    text-transform: uppercase;
  }
  .counter span {
    color: var(--gold);
    font-weight: 600;
  }
  .qr-hint {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.3);
    text-transform: uppercase;
  }
  .qr-hint em {
    color: var(--punch);
    font-style: normal;
  }
</style>
</head>
<body>

<div class="display-header">
  <div>
    <div class="display-title">PUNCHED IN</div>
    <div class="display-subtitle">Bloc Gallery · Apr 13–17, 2026</div>
  </div>
  <div class="live-indicator">
    <div class="live-dot"></div>
    Live Archive
  </div>
</div>

<div id="cardStage"></div>

<div class="display-footer">
  <div class="counter">Visitors logged: <span id="totalCount">0</span></div>
  <div class="qr-hint">Scan QR to <em>Punch In</em></div>
</div>

<script>
  const SHEET_ID = '1C04UPwBT2Pbzy9Oxc7WOeI1N0_YCDuAVWVzeixeddhg';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

  let allCards = [];
  let displayedIds = new Set();

  function getRoleClass(role) {
    if (!role) return 'role-default';
    const r = role.toLowerCase();
    if (r.includes('student')) return 'role-student';
    if (r.includes('faculty')) return 'role-faculty';
    if (r.includes('artist')) return 'role-artist';
    if (r.includes('outside')) return 'role-outside';
    return 'role-default';
  }

  function makeHoles(seed) {
    let html = '';
    for (let i = 0; i < 12; i++) {
      const punched = ((seed >> i) & 1) ? ' punched' : '';
      html += `<div class="hole${punched}"></div>`;
    }
    return html;
  }

  function parseResult(resultText) {
    try {
      const clean = resultText.replace(/```json|```/g, '').trim();
      return JSON.parse(clean);
    } catch (e) {
      return null;
    }
  }

  // ─── FIX 1: 카드를 화면 전체에 고르게 퍼뜨리는 새 배치 방식 ───
  // 기존: 6개 고정 zone → 카드가 많아지면 겹침
  // 새로: 화면을 격자(grid)로 나누고, 각 셀 안에서 랜덤 위치 선택
  // 헤더(80px)와 푸터(80px) 영역은 제외해서 겹치지 않게 함
  function getSpreadPosition(index, totalSoFar) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const HEADER_SAFE = 90;   // 헤더 아래
    const FOOTER_SAFE = 90;   // 푸터 위
    const CARD_W = 280;       // 카드 너비 + 여유
    const CARD_H = 220;       // 카드 높이 + 여유

    const usableW = w - CARD_W;
    const usableH = h - HEADER_SAFE - FOOTER_SAFE - CARD_H;

    // 화면을 cols × rows 격자로 나눔
    const cols = Math.max(3, Math.floor(w / (CARD_W + 20)));
    const rows = Math.max(2, Math.floor(usableH / (CARD_H + 20)));

    const cellW = usableW / cols;
    const cellH = usableH / rows;

    // index를 격자 셀에 순환 배치 (모든 셀을 고루 채움)
    const cellIndex = index % (cols * rows);
    const col = cellIndex % cols;
    const row = Math.floor(cellIndex / cols);

    // 셀 안에서 랜덤 오프셋 (40% 범위 내)
    const jitterX = (Math.random() - 0.5) * cellW * 0.4;
    const jitterY = (Math.random() - 0.5) * cellH * 0.4;

    const x = Math.floor(col * cellW + cellW / 2 + jitterX);
    const y = Math.floor(HEADER_SAFE + row * cellH + cellH / 2 + jitterY);

    return { x: Math.max(0, Math.min(x, usableW)), y: Math.max(HEADER_SAFE, y) };
  }

  function placeCard(cardData, index) {
    const stage = document.getElementById('cardStage');

    const parsed = parseResult(cardData.result);
    if (!parsed) return;

    const roleClass = getRoleClass(cardData.role);
    const seed = parsed.seed || Math.floor(Math.random() * 4095);
    const rot = (Math.random() * 8 - 4).toFixed(1);  // -4deg ~ +4deg (기존보다 약간 더 기울임)

    // FIX 3: duration을 짧게 해서 더 활발하게 움직이게 (기존 8~14s → 5~9s)
    const duration = (5 + Math.random() * 4).toFixed(1);
    // delay를 음수로 줘서 카드들이 제각각 다른 타이밍에 움직임
    const delay = -(Math.random() * parseFloat(duration)).toFixed(1);

    const { x, y } = getSpreadPosition(index, allCards.length);

    const tags = (parsed.tags || []).slice(0, 3).map(t =>
      `<div class="card-tag">${t}</div>`
    ).join('');

    const timeStr = new Date(cardData.timestamp).toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit'
    });

    // FIX 2: nickname — Google Sheets gviz API는 빈 셀을 null로 반환함
    // cardData.nickname이 null/undefined/''/공백인 경우 모두 'Anonymous'로 폴백
    // 실제 값이 있을 때만 표시
    const displayName = (cardData.nickname && cardData.nickname.trim())
      ? cardData.nickname.trim()
      : 'Anonymous';

    const card = document.createElement('div');
    card.className = `float-card ${roleClass}`;
    card.style.cssText = `
      left: ${x}px;
      top: ${y}px;
      --rot: ${rot}deg;
      --duration: ${duration}s;
      --delay: ${delay}s;
    `;
    card.innerHTML = `
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-top">
          <div>
            <div class="card-exhibition">CJR · Punched In</div>
            <div class="card-name">${displayName}</div>
          </div>
          <div class="card-num">#${String(index + 1).padStart(4, '0')}</div>
        </div>
        <div class="hole-row">${makeHoles(seed)}</div>
        <div class="card-quote">${parsed.key_quote || ''}</div>
        <div class="card-tags">${tags}</div>
        <div class="card-footer">
          <div class="card-time">${timeStr}</div>
          <div class="card-type">${parsed.visitor_type || ''}</div>
        </div>
      </div>
    `;

    stage.appendChild(card);
    // 약간의 딜레이 후 visible 클래스 추가 → fade-in 효과
    setTimeout(() => card.classList.add('visible'), 150);
  }

  async function fetchData() {
    try {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      const json = JSON.parse(
        text
          .replace('/*O_o*/', '')
          .replace('google.visualization.Query.setResponse(', '')
          .replace(/\);$/, '')
      );

      const rows = json.table.rows || [];
      const newCards = [];

      rows.forEach((row, i) => {
        const cols = row.c || [];
        const id = i;
        if (displayedIds.has(id)) return;

        const timestamp = cols[0]?.v || '';

        // ─── FIX 2: gviz API는 null 셀을 {v: null}로 반환 ───
        // null 체크를 명시적으로 해야 'Anonymous' 버그가 사라짐
        const nickname  = cols[1]?.v ?? '';   // null이면 빈 문자열
        const role      = cols[2]?.v ?? '';
        const language  = cols[3]?.v ?? '';
        const response  = cols[4]?.v ?? '';
        const result    = cols[5]?.v ?? '';

        if (result) {
          newCards.push({ id, timestamp, nickname, role, language, response, result });
        }
      });

      newCards.forEach((card, i) => {
        displayedIds.add(card.id);
        allCards.push(card);
        // 새 카드마다 400ms 간격으로 등장 (기존 300ms보다 약간 여유있게)
        setTimeout(() => placeCard(card, allCards.length - 1), i * 400);
      });

      document.getElementById('totalCount').textContent = allCards.length;

    } catch (e) {
      console.error('Fetch error:', e);
    }
  }

  fetchData();
  setInterval(fetchData, 30000);
</script>
</body>
</html>
